<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Basica</title>
</head>
<body>
    <h1>Calculadora Basica</h1>
    <form>
        <label>Numero 1:</label>
        <input type="number" id="n1" name="id" placeholder="Ingrese un numero"/>
        <br>
        <label>Numero 2:</label>
        <input type="number" id="n2" name="id" placeholder="Ingrese un numero"/>
        <p id="Resultado">Resultado: 0</p>
        <input type="button" value="Suma" onclick="suma()"/>
        <input type="button" value="Resta" onclick="resta()"/>
        <input type="button" value="Multiplicacion" onclick="multiplicacion()"/>
        <input type="button" value="Division" onclick="division()"/>
    </form>
    <script src="/js/calculadora.js"></script>
</body>
</html>
